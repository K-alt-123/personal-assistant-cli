[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-cli"
version = "1.1.0"
description = "A command-line address book and notebook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["colorama>=0.4.6,<0.5"]

[project.scripts]
personal-assistant = "personal_assistant.assistant:main"

[tool.setuptools.packages.find]
include = ["personal_assistant*"]
